# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Prozentuale Zunahme und Abnahme
description: >-
  Den neuen Wert nach einer Erhöhung oder Senkung um p % berechnen, und rückwärts den alten Wert: mit dem Faktor, am
  Prozentstreifen, mit Beispielen und Übungen.
competencies: [prozent-veraenderung]
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: >-
          Eine Hose kostet 80 €. Der Preis steigt um 25 %. Was kostet sie danach? Am **Prozentstreifen** siehst du: Bei
          einer Zunahme wird der Streifen länger als 100 %.
      - type: vue-component
        id: streifen-zunahme
        component: ProzentStreifen
        props:
          prozent: 125
          prozentText: "125 %"
          grundwert: "80 €"
          wert: "? €"
          faktor: "· 1,25"
        nojs: |
          Prozentstreifen: Der Streifen reicht über 100 % hinaus bis 125 %. Unten steht der alte Preis 80 € bei 100 %,
          der neue Preis ist gesucht. Ein Pfeil zeigt den Faktor 1,25.
      - type: text
        text: >-
          Die 80 € sind 100 %. Der neue Preis ist 125 % davon. Der Pfeil zeigt den **Faktor** 1,25. Mit ihm rechnest du
          in einem Schritt: 80 € · 1,25 = 100 €. Ohne Faktor wären es zwei Schritte: erst 25 % von 80 € ausrechnen
          (20 €), dann addieren.
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: text
        text: >-
          Bei einer **Zunahme** um $p\,\%$ rechnest du mit dem Faktor $1 + \frac{p}{100}$, bei einer **Abnahme** mit
          $1 - \frac{p}{100}$.
      - type: formula
        formula: '\text{neuer Wert} = \text{alter Wert} \cdot \text{Faktor}'
      - type: table
        caption: Zunahme und Abnahme um 25 %
        header: [Änderung, Anteil vom alten Wert, Faktor]
        rows:
          - ["Zunahme um 25 %", "125 %", "1,25"]
          - ["Abnahme um 25 %", "75 %", "0,75"]
      - type: definition
        term: vermehrter Grundwert
        explanation: Der neue Wert nach einer Zunahme um $p\,\%$, also $(100 + p)\,\%$ des alten Werts.
      - type: definition
        term: verminderter Grundwert
        explanation: Der neue Wert nach einer Abnahme um $p\,\%$, also $(100 - p)\,\%$ des alten Werts.
      - type: text
        text: "**Rückwärts** (alter Wert gesucht) teilst du durch den Faktor:"
      - type: formula
        formula: '\text{alter Wert} = \text{neuer Wert} : \text{Faktor}'
      - type: note
        title: Typischer Fehler
        blocks:
          - type: text
            text: >-
              Die Prozente auf den neuen Wert beziehen. Sie gehören immer zum alten Wert, denn der ist 100 %.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Neuer Wert gesucht
        blocks:
          - type: text
            text: Eine Hose kostet 80 €. Im Ausverkauf gibt es 25 % Rabatt. Was kostet sie jetzt?
          - type: vue-component
            id: streifen-abnahme
            component: ProzentStreifen
            props:
              prozent: 75
              prozentText: "75 %"
              grundwert: "80 €"
              wert: "60 €"
              faktor: "· 0,75"
            nojs: |
              Prozentstreifen: Der Streifen reicht nur bis 75 %. Unten steht der alte Preis 80 € bei 100 %, der neue
              Preis ist 60 €. Ein Pfeil zeigt den Faktor 0,75.
          - type: table
            caption: Abnahme um 25 % mit dem Faktor
            rowHeaders: true
            rows:
              - ["Alter Wert", "80 € = 100 %"]
              - ["Faktor", "$1 - \\frac{25}{100} = 0{,}75$"]
              - ["Neuer Wert", "$80 \\cdot 0{,}75 = 60$, also **60 €**"]
      - type: example
        title: Alter Wert gesucht
        blocks:
          - type: text
            text: Nach einer Erhöhung um 25 % kostet ein Ticket 150 €. Was hat es vorher gekostet?
          - type: vue-component
            id: streifen-rueckwaerts
            component: ProzentStreifen
            props:
              prozent: 125
              prozentText: "125 %"
              grundwert: "? €"
              wert: "150 €"
              faktor: "· 1,25"
            nojs: |
              Prozentstreifen: Der Streifen reicht bis 125 %. Der neue Preis 150 € steht unten bei 125 %, der alte Preis
              bei 100 % ist gesucht. Ein Pfeil zeigt den Faktor 1,25.
          - type: table
            caption: Rückwärts rechnen durch den Faktor
            rowHeaders: true
            rows:
              - ["Neuer Wert", "150 € = 125 % des alten Preises"]
              - ["Faktor", "$1 + \\frac{25}{100} = 1{,}25$"]
              - ["Alter Wert", "$150 : 1{,}25 = 120$, also **120 €**"]
          - type: text
            text: >-
              Falsch wäre: 150 € − 25 % von 150 € = 112,50 €. Die 25 % gehören zum alten Preis, nicht zu 150 €.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: vue-component
        id: streifen-aufgabe
        component: ProzentStreifen
        props:
          prozent: 125
          prozentText: "125 %"
          grundwert: "80 €"
          wert: "100 €"
        nojs: |
          Prozentstreifen: Der Streifen reicht über 100 % hinaus bis 125 %. Unten steht 80 € bei 100 % und 100 € am
          Ende des Streifens.
      - type: single-choice
        id: streifen-lesen
        text: "Eine Hose kostete 80 €. Der Streifen zeigt den neuen Preis von 100 €. Was ist passiert?"
        options:
          - text: Der Preis ist um 25 % gestiegen.
            correct: true
            info: Der Streifen ragt 25 % über die 100 % hinaus. Das sind 20 € mehr als vorher.
          - text: Der Preis ist um 125 % gestiegen.
            correct: false
            info: 125 % ist der neue Preis, gemessen am alten. Gestiegen ist er nur um den Teil über 100 %, also um 25 %.
          - text: Der Preis ist um 25 % gesunken.
            correct: false
            info: Der Streifen ist länger als 100 %. Bei einer Abnahme wäre er kürzer.
        explanation: Reicht der Streifen über 100 % hinaus, ist der Wert gestiegen, und zwar um den Teil über 100 %.
        links:
          - title: Prozentuale Zu- und Abnahme (Lernlandkarte)
            url: "https://lernapps.net/apps/map/mathematik/c/prozent-veraenderung/"
      - type: single-choice
        id: faktor-waehlen
        text: "Ein Rabatt von 20 % senkt einen Preis. Mit welchem Faktor rechnest du den neuen Preis aus?"
        options:
          - text: "0,8"
            correct: true
            info: Nach 20 % Rabatt bleiben 80 % des Preises übrig. 80 % sind der Faktor 0,8.
          - text: "0,2"
            correct: false
            info: 0,2 sind die 20 % Rabatt selbst. Damit rechnest du den Abzug aus, nicht den neuen Preis.
          - text: "1,2"
            correct: false
            info: Der Faktor 1,2 gehört zu einer Zunahme um 20 %. Bei einem Rabatt ist der Faktor kleiner als 1.
        explanation: Bei einer Abnahme um 20 % bleiben 100 % − 20 % = 80 % übrig. Der Faktor ist 0,8.
        links:
          - title: Prozentuale Zu- und Abnahme (Lernlandkarte)
            url: "https://lernapps.net/apps/map/mathematik/c/prozent-veraenderung/"
      - type: vue-component
        id: veraenderung-aufgabe
        component: ProzentVeraenderung
        examples:
          accepted:
            - { answer: { alt: "600" }, seed: 1 }
            - { answer: { alt: "714/1,19" }, seed: 1 }
            - { answer: { neu: "39" }, seed: 3 }
          rejected:
            - { answer: { alt: "578,34" }, seed: 1 }
            - { answer: { neu: "81" }, seed: 3 }
            - { answer: { neu: "21" }, seed: 3 }
      - type: generated
        id: veraenderung-senkung
        practice: Und jetzt ohne Geschichte, nur die Rechnung.
        given:
          alt: { int: [20, 400], step: 5 }
          p: { oneOf: [5, 10, 12, 15, 20, 25, 30, 40] }
        where: ["decimals(alt * (1 - p / 100)) <= 2"]
        task:
          text: "Ein Preis von {{alt}} € wird um {{p}} % gesenkt. Wie hoch ist der neue Preis?"
        answer: { value: "alt * (1 - p / 100)", compare: { number: { format: money } } }
        mistakes:
          - {
              value: "alt * (1 + p / 100)",
              message: "Du hast in die falsche Richtung gerechnet. Der Preis sinkt, also ist der Faktor kleiner als 1.",
            }
          - {
              value: "alt * p / 100",
              message: "Das ist nur die Senkung. Gefragt ist der neue Preis: alter Preis minus Senkung.",
            }
        hint: "Nach der Senkung sind es 100 % − {{p}} % des alten Preises. Rechne mit dem Faktor 1 − {{p}} : 100."
        steps:
          - '$\text{neuer Wert} = \text{alter Wert} \cdot (1 - \frac{p}{100})$'
          - '$\text{neuer Wert} = {{alt}} \cdot (1 - \frac{{{p}}}{100}) = {{answer}}$, also {{answer}} €.'
      - type: true-false
        id: alter-preis-falsch
        text: "Ein Preis ist um 25 % gestiegen und kostet jetzt 150 €. Der alte Preis war dann 150 € − 25 % von 150 € = 112,50 €."
        answer: false
        explanation: >-
          Die 25 % gehören zum alten Preis, nicht zum neuen. Rückwärts teilst du durch den Faktor: 150 € : 1,25 =
          120 €. Zur Probe: 120 € · 1,25 = 150 €.
        links:
          - title: Prozentuale Zu- und Abnahme (Lernlandkarte)
            url: "https://lernapps.net/apps/map/mathematik/c/prozent-veraenderung/"
      - type: generated
        id: veraenderung-rueckwaerts
        practice: Rückwärts gerechnet, ohne Geschichte.
        given:
          neu: { int: [20, 600] }
          p: { oneOf: [5, 10, 20, 25, 50] }
        where: ["decimals(neu / (1 + p / 100)) <= 2"]
        task:
          text: "Nach einer Erhöhung um {{p}} % beträgt ein Preis {{neu}} €. Wie hoch war er vorher?"
        answer: { value: "neu / (1 + p / 100)", compare: { number: { format: money } } }
        mistakes:
          - {
              value: "neu * (1 - p / 100)",
              message: "Die {{p}} % gehören zum alten Preis, nicht zu {{neu}} €. Der neue Preis ist nicht 100 %.",
            }
          - {
              value: "neu * (1 + p / 100)",
              message: "Du hast noch einmal erhöht. Rückwärts teilst du durch den Faktor, statt mit ihm zu malnehmen.",
            }
        hint: "{{neu}} € sind 100 % + {{p}} % des alten Preises. Teile durch den Faktor 1 + {{p}} : 100."
        steps:
          - '$\text{alter Wert} = \text{neuer Wert} : (1 + \frac{p}{100})$'
          - '$\text{alter Wert} = {{neu}} : (1 + \frac{{{p}}}{100}) = {{answer}}$, also {{answer}} €.'

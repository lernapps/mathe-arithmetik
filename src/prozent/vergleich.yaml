# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Zwei Werte am Prozentstreifen vergleichen
description: >-
  Um wie viel Prozent ist A größer oder kleiner als B? Die Bezugsgröße steht nach „als“. Mit zwei Prozentstreifen, einem
  Beispiel und Übungen.
competencies: [prozent-vergleich]
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: >-
          Ein Rucksack kostet in Laden A 150 €, in Laden B 120 €. Der Unterschied ist 30 €. Um wie viel Prozent ist A
          teurer als B? Der Streifen zeigt: Der Teil ist bekannt, der Prozentsatz fehlt.
      - type: vue-component
        id: streifen-frage
        component: ProzentStreifen
        props:
          prozent: 25
          prozentText: "? %"
          grundwert: "120 €"
          wert: "30 €"
          verdeckt: true
        nojs: |
          Prozentstreifen: Der ganze Streifen ist der Preis in Laden B, 120 €, das sind 100 %. Der Unterschied von 30 € ist ein
          Teil davon. Wie viel Prozent das sind, ist gesucht.
      - type: text
        text: >-
          Der ganze Streifen ist der **Grundwert**. Hier ist es der Preis von B, denn A ist teurer *als B*. Das Wort
          nach „als“ nennt die **Bezugsgröße**. Wechselt die Bezugsgröße, ändert sich der Prozentsatz, obwohl der
          Unterschied gleich bleibt.
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: formula
        formula: 'p = \frac{\text{Unterschied}}{\text{Bezugsgröße}} \cdot 100'
      - type: definition
        term: Bezugsgröße
        explanation: >-
          Der Wert, mit dem verglichen wird: Er ist 100 %. Im Satz steht er nach dem Wort **„als“**.
      - type: note
        title: Merkhilfe
        blocks:
          - type: text
            text: >-
              Nach „als“ steht die 100 %. „A ist größer als B“: B ist 100 %. „B ist kleiner als A“: A ist 100 %.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Ein Rucksack in zwei Läden
        blocks:
          - type: vue-component
            id: streifen-laden-b
            component: ProzentStreifen
            props:
              prozent: 25
              prozentText: "25 %"
              grundwert: "120 €"
              wert: "30 €"
            nojs: |
              Prozentstreifen: Der ganze Streifen ist Laden B mit 120 €. Der Unterschied von 30 € ist 25 % davon.
          - type: vue-component
            id: streifen-laden-a
            component: ProzentStreifen
            props:
              prozent: 20
              prozentText: "20 %"
              grundwert: "150 €"
              wert: "30 €"
            nojs: |
              Prozentstreifen: Der ganze Streifen ist Laden A mit 150 €. Derselbe Unterschied von 30 € ist nur 20 % davon.
          - type: table
            caption: Zwei Fragen, zwei Bezugsgrößen
            header: [Frage mit Bezugsgröße, Rechnung]
            rows:
              - ["A teurer als B. Bezugsgröße: B = 120 €", "$p = \\frac{30}{120} \\cdot 100 = 25$, also **25 %**"]
              - ["B billiger als A. Bezugsgröße: A = 150 €", "$p = \\frac{30}{150} \\cdot 100 = 20$, also **20 %**"]
      - type: example
        title: Mehr Schüler, kleinerer Anteil
        blocks:
          - type: text
            text: >-
              In der 7a sind 18 von 24 Schülern im Sportverein, in der 7b 21 von 30. Die 7b hat mehr Schüler im Verein.
              Hat sie auch den größeren Anteil?
          - type: text
            text: >-
              7a: 18 : 24 = 0,75 = 75 %. 7b: 21 : 30 = 70 %. Der Anteil der 7a ist größer, obwohl es weniger Schüler sind. Bei
              Prozenten zählt der Anteil, nicht die Stückzahl.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: bezugsgroesse-waehlen
        text: "Laden A: 150 €, Laden B: 120 €. „B ist billiger als A.“ Welcher Wert ist die Bezugsgröße (100 %)?"
        options:
          - text: "A, also 150 €"
            correct: true
            info: "Das Wort nach „als“ ist A. Darum ist der Preis von A das Ganze."
          - text: "B, also 120 €"
            correct: false
            info: "B steht vor „als“. Es ist der Wert, der verglichen wird, nicht die Bezugsgröße."
          - text: "der Unterschied, also 30 €"
            correct: false
            info: "Der Unterschied ist ein Teil des Ganzen, nicht das Ganze."
        explanation: "Die Bezugsgröße steht nach „als“. Hier ist das A mit 150 €."
      - type: vue-component
        id: streifen-8a
        component: ProzentStreifen
        props:
          prozent: 75
          prozentText: "? %"
          grundwert: "20 Schüler"
          wert: "15 Schüler"
          verdeckt: true
        nojs: |
          Prozentstreifen für die 8a: Der ganze Streifen sind 20 Schüler, davon haben 15 ein Fahrrad. Der Prozentsatz ist
          gesucht.
      - type: vue-component
        id: streifen-8b
        component: ProzentStreifen
        props:
          prozent: 64
          prozentText: "? %"
          grundwert: "25 Schüler"
          wert: "16 Schüler"
          verdeckt: true
        nojs: |
          Prozentstreifen für die 8b: Der ganze Streifen sind 25 Schüler, davon haben 16 ein Fahrrad. Der Prozentsatz ist
          gesucht.
      - type: single-choice
        id: anteil-vergleichen
        text: "In der 8a haben 15 von 20 Schülern ein Fahrrad, in der 8b 16 von 25. Welche Klasse hat den größeren Anteil?"
        options:
          - text: die 8a
            correct: true
            info: "15 : 20 = 75 %, und 16 : 25 = 64 %. Die 8a hat den größeren Anteil."
          - text: die 8b
            correct: false
            info: "In der 8b sind es zwar mehr Schüler (16 statt 15), aber der Anteil ist nur 64 %. Die 8a hat 75 %."
          - text: Beide haben denselben Anteil.
            correct: false
            info: "Die Anteile sind 75 % und 64 %. Sie sind nicht gleich."
        explanation: "Rechne beide Anteile aus: 75 % in der 8a, 64 % in der 8b. Mehr Schüler heißt nicht mehr Prozent."
      - type: vue-component
        id: vergleich-aufgabe
        component: ProzentVergleich
        examples:
          accepted:
            - { answer: { prozentsatz: "12,5" }, seed: 1 }
            - { answer: { prozentsatz: "24/192*100" }, seed: 1 }
            - { answer: { prozentsatz: "8" }, seed: 2 }
          rejected:
            - { answer: { prozentsatz: "14,3" }, seed: 1 }
            - { answer: { prozentsatz: "24" }, seed: 1 }
            - { answer: { prozentsatz: "87,5" }, seed: 1 }
      - type: generated
        id: vergleich-rechnen
        practice: Und jetzt ohne Geschichte, nur die Rechnung.
        given:
          b: { oneOf: [20, 25, 40, 50, 80, 120, 125, 150, 200, 250] }
          a: { int: [21, 400] }
        where:
          [
            "a > b",
            "a < 2 * b",
            "decimals((a - b) * 100 / b) <= 1",
            "a != 100",
            "round((a - b) * 100 / a, 1) != round((a - b) * 100 / b, 1)",
          ]
        task:
          text: "A ist {{a}}, B ist {{b}}. Um wie viel Prozent ist A größer als B?"
        answer: { value: "(a - b) * 100 / b", compare: { number: { format: percent, decimals: 1 } } }
        mistakes:
          - {
              value: "(a - b) * 100 / a",
              message: "Das ist die Antwort auf die andere Frage. Die Bezugsgröße (100 %) ist die Zahl nach „als“: B = {{b}}.",
            }
          - {
              value: "a - b",
              message: "Das ist nur der Unterschied. Gefragt ist der Unterschied in Prozent der Bezugsgröße {{b}}.",
            }
          - {
              value: "a * 100 / b",
              message: "Das ist das Verhältnis der beiden Werte in Prozent. Gefragt ist, um wie viel Prozent mehr, also ziehst du die 100 % noch ab.",
            }
        hint: "Die Bezugsgröße steht nach „als“: B = {{b}} ist 100 %. Teile den Unterschied durch {{b}}."
        steps:
          - '$p = \frac{\text{Unterschied}}{\text{Bezugsgröße}} \cdot 100$'
          - '$p = \frac{{{a}} - {{b}}}{{{b}}} \cdot 100 = {{answer}}$, also {{answer}} %.'
      - type: generated
        id: vergleich-kleiner
        practice: Jetzt andersherum, mit einer anderen Bezugsgröße.
        given:
          a: { oneOf: [20, 25, 40, 50, 80, 120, 125, 150, 200, 250] }
          b: { int: [11, 249] }
        where:
          [
            "b < a",
            "a < 2 * b",
            "decimals((a - b) * 100 / a) <= 1",
            "b != 100",
            "a - b != b * 100 / a",
            "round((a - b) * 100 / a, 1) != round((a - b) * 100 / b, 1)",
          ]
        task:
          text: "A ist {{a}}, B ist {{b}}. Um wie viel Prozent ist B kleiner als A?"
        answer: { value: "(a - b) * 100 / a", compare: { number: { format: percent, decimals: 1 } } }
        mistakes:
          - {
              value: "(a - b) * 100 / b",
              message: "Du hast durch B geteilt. Nach „als“ steht A: A = {{a}} ist hier die Bezugsgröße (100 %).",
            }
          - {
              value: "a - b",
              message: "Das ist nur der Unterschied. Gefragt ist der Unterschied in Prozent der Bezugsgröße {{a}}.",
            }
          - {
              value: "b * 100 / a",
              message: "Das ist der Anteil von B an A. Gefragt ist, um wie viel Prozent B kleiner ist, also ziehst du das von 100 % ab.",
            }
        hint: "Die Bezugsgröße steht nach „als“: A = {{a}} ist 100 %. Teile den Unterschied durch {{a}}."
        steps:
          - '$p = \frac{\text{Unterschied}}{\text{Bezugsgröße}} \cdot 100$'
          - '$p = \frac{{{a}} - {{b}}}{{{a}}} \cdot 100 = {{answer}}$, also {{answer}} %.'

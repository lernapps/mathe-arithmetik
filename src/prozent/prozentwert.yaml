# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Drei Grundaufgaben am Prozentstreifen – Prozentwert berechnen
description: "Der Prozentstreifen zeigt Prozentsatz, Prozentwert und Grundwert. Erste Grundaufgabe: den Prozentwert berechnen, mit Dreisatz-Tabelle und Formel."
competencies: [prozent-prozentwert]
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: >-
          Ein Fahrrad kostet 250 €. Im Angebot gibt es 12 % Rabatt. Wie viel Euro sparst du? Dafür gibt es den
          **Prozentstreifen**: ein Streifen, auf dem oben die Prozente stehen und unten die Euro.
      - type: vue-component
        id: streifen-fahrrad
        component: ProzentStreifen
        props:
          prozent: 12
          prozentText: "12 %"
          grundwert: "250 €"
          wert: "? €"
        nojs: |
          Prozentstreifen: Oben die Skala von 0 % bis 100 %, unten der Grundwert 250 €. Der blaue Teil reicht bis 12 %.
          Der Wert dazu unten ist gesucht.
      - type: text
        text: >-
          Der ganze Streifen ist das Ganze, also der **Grundwert**: 250 € sind 100 %. Der blaue Teil sind 12 %, der
          **Prozentsatz**. Gesucht ist der **Prozentwert**: wie viel Euro der blaue Teil sind. Es gibt drei Grundaufgaben,
          je nachdem, welche der drei Stellen fehlt. Auf dieser Seite fehlt der Prozentwert.
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: text
        text: >-
          Der Prozentwert $W$ ist der Teil des Grundwerts $G$, der zum Prozentsatz $p\,\%$ gehört. Er hat dieselbe Einheit
          wie der Grundwert. Rechnen kannst du auf zwei Wegen. Beide rechnen dasselbe. Der **Dreisatz** ist ein Rechenweg über 1 %: Du rechnest aus, was 1 % ist, und dann, was $p\,\%$ sind. Er geht in drei Zeilen
          von 100 % auf 1 % und dann auf $p\,\%$.
      - type: table
        caption: Dreisatz-Tabelle und Formel nebeneinander, für 12 % von 250 €
        header: [Dreisatz-Tabelle, Formel]
        rows:
          - ["100 % sind 250 €", "$G = 250$ und $p = 12$"]
          - ["1 % sind 250 € : 100 = 2,50 €", "$W = \\frac{G \\cdot p}{100}$"]
          - ["12 % sind 2,50 € · 12 = 30 €", "$W = \\frac{250 \\cdot 12}{100} = 30$"]
      - type: note
        title: Merkhilfe
        blocks:
          - type: text
            text: >-
              Im Dreisatz teilst du zuerst durch 100 und nimmst dann mal $p$. In der Formel rechnest du erst $G \cdot p$, dann geteilt
              durch 100. Das Ergebnis ist dasselbe.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Rabatt auf Kopfhörer
        blocks:
          - type: text
            text: Kopfhörer kosten 60 €. Es gibt 15 % Rabatt. Wie viel Euro sparst du?
          - type: vue-component
            id: streifen-kopfhoerer
            component: ProzentStreifen
            props:
              prozent: 15
              prozentText: "15 %"
              grundwert: "60 €"
              wert: "9 €"
            nojs: |
              Prozentstreifen: Oben die Skala von 0 % bis 100 %, unten der Grundwert 60 €. Der blaue Teil reicht bis 15 %
              und ist 9 € lang.
          - type: table
            caption: Die Größen im Beispiel und die Rechnung
            rowHeaders: true
            rows:
              - ["Grundwert $G$", "60 € (der volle Preis)"]
              - ["Prozentsatz $p$", "15 %"]
              - ["Rechnung", "$W = \\frac{60 \\cdot 15}{100} = 9$"]
              - ["Prozentwert $W$", "**9 €** Rabatt"]
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: vue-component
        id: streifen-aufgabe
        component: ProzentStreifen
        props:
          prozent: 25
          prozentText: "25 %"
          grundwert: "80 €"
          wert: "? €"
        nojs: |
          Prozentstreifen: Oben die Skala von 0 % bis 100 %, unten der Grundwert 80 €. Der blaue Teil reicht bis 25 %.
          Der Wert dazu unten ist ein Fragezeichen.
      - type: single-choice
        id: prozentwert-streifen
        text: "Am Streifen steht unten bei den 25 % ein Fragezeichen. Welche Stelle wird gesucht?"
        options:
          - text: der Prozentwert
            correct: true
            info: Gesucht ist der Wert in Euro, der zu 25 % gehört. Das ist ein Teil des Grundwerts, also der Prozentwert.
          - text: der Prozentsatz
            correct: false
            info: Der Prozentsatz steht schon oben (25 %). Er ist bekannt.
          - text: der Grundwert
            correct: false
            info: Der Grundwert steht schon unten am Ende des Streifens (80 €). Er ist bekannt.
        explanation: Das Fragezeichen steht bei dem Wert in Euro. Dieser Teil des Grundwerts ist der Prozentwert.
      - type: vue-component
        id: prozentwert-aufgabe
        component: ProzentProzentwert
        examples:
          accepted:
            - { answer: { prozentwert: "74,70" }, seed: 1 }
            - { answer: { prozentwert: "74.7 €" }, seed: 1 }
            - { answer: { prozentwert: "1245*6/100" }, seed: 1 }
            - { answer: { prozentwert: "1870" }, seed: 2 }
          rejected:
            - { answer: { prozentwert: "7470" }, seed: 1 }
            - { answer: { prozentwert: "1170,30" }, seed: 1 }
            - { answer: { prozentwert: "75" }, seed: 1 }
            - { answer: { prozentwert: "74" }, seed: 1 }
            - { answer: { prozentwert: "" } }
            - { answer: { prozentwert: "abc" } }
      - type: generated
        id: prozentwert-rechnen
        practice: Und jetzt ohne Geschichte, nur die Rechnung.
        given:
          G: { int: [20, 2000], step: 10 }
          p: { oneOf: [2, 3, 4, 5, 6, 8, 10, 12, 12.5, 15, 18, 20, 24, 25, 30, 35, 40, 45, 60, 65, 70, 75, 80, 85, 90] }
        where: ["decimals(G * p / 100) <= 2"]
        task:
          text: "Berechne {{p}} % von {{G}} €."
        answer: { value: "G * p / 100", compare: { number: { format: money } } }
        mistakes:
          - { value: "G * p", message: "Du hast vergessen, durch 100 zu teilen: {{p}} % sind {{p}} Hundertstel." }
          - {
              value: "G - G * p / 100",
              message: "Du hast den Rest ausgerechnet, nicht den Anteil. Gefragt ist der Prozentwert selbst.",
            }
        hint: "Rechne erst 1 % aus: {{G}} € geteilt durch 100. Dann mal {{p}}."
        steps:
          - '$W = \frac{G \cdot p}{100}$'
          - '$W = \frac{{{G}} \cdot {{p}}}{100} = {{answer}}$, also {{answer}} €.'
      - type: generated
        id: prozentwert-mwst
        practice: Eine Aufgabe aus dem Alltag. Die Mehrwertsteuer ist eine Steuer, die zum Preis dazukommt.
        given:
          G: { int: [20, 400], step: 10 }
        task:
          text: "Eine Jacke kostet ohne Steuer {{G}} €. Die Mehrwertsteuer beträgt 19 %. Wie viel Euro Mehrwertsteuer sind das?"
        answer: { value: "G * 19 / 100", compare: { number: { format: money } } }
        mistakes:
          - { value: "G * 19", message: "Du hast vergessen, durch 100 zu teilen: 19 % sind 19 Hundertstel." }
          - {
              value: "G + G * 19 / 100",
              message: "Das ist der Preis mit Steuer. Gefragt ist nur die Mehrwertsteuer, also der Prozentwert.",
            }
        hint: "Rechne erst 1 % aus: {{G}} € geteilt durch 100. Dann mal 19."
        steps:
          - '$W = \frac{G \cdot p}{100}$'
          - '$W = \frac{{{G}} \cdot 19}{100} = {{answer}}$, also {{answer}} €.'

        - /prozent/grundwert/#grundwert-rechnen
    - exercises:
        - /prozent/vergleich/#vergleich-aufgabe
        - /prozent/vergleich/#vergleich-rechnen
        - /prozent/sachaufgaben/#sachaufgaben-aufgabe
        - /prozent/sachaufgaben/#sachaufgaben-dreisatz
    - exercises:
        - /prozent/veraenderung/#veraenderung-aufgabe
        - /prozent/veraenderung/#veraenderung-senkung
        - /prozent/veraenderung/#veraenderung-rueckwaerts
    - exercises:

# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Prozentrechnung
summary: >-
  Prozentrechnung und einfache Zinsen aus Klasse 7 und 8, Schritt für Schritt am Prozentstreifen: Grundwert,
  Prozentwert und Prozentsatz erkennen und berechnen, Vergleiche und Sachaufgaben, Zu- und Abnahme, Prozentpunkte und
  Zinsen. Jede Seite hat eine Erklärung, ein Beispiel, ein Bild und
  so viele Aufgaben, wie du willst; jede Aufgabe sagt dir sofort, ob dein Ergebnis stimmt, und zeigt dir auf Wunsch
  den Rechenweg.
pages:
  [
    recap,
    grundbegriffe,
    prozentwert,
    prozentsatz,
    grundwert,
    vergleich,
    sachaufgaben,
    veraenderung,
    prozentpunkte,
    zinsen,
  ]
selfAssessment:
  pages:
    - exercises:
        - /prozent/prozentwert/#prozentwert-aufgabe
        - /prozent/prozentwert/#prozentwert-rechnen
        - /prozent/prozentsatz/#prozentsatz-aufgabe
    - exercises:
        - /prozent/prozentsatz/#prozentsatz-rechnen

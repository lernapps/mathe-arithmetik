# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: >-
  Wiederholung für das Kapitel Prozentrechnung: Stellenwert, Bruch, Dezimalzahl. Je Baustein Begriffe, ein Beispiel und
  zwei Übungen.
recap: [mathematik/natuerliche-zahlen, mathematik/brueche-begriff, mathematik/dezimalbrueche]
blocks:
  - type: text
    text: >-
      Das brauchst du für dieses Kapitel: Zahlen nach Stellen lesen, Brüche deuten und Brüche als Dezimalzahlen
      schreiben. Lies jeden Abschnitt und löse am Ende die zwei Aufgaben. Sie zählen nichts und werden nicht gespeichert.
  - type: section
    id: stellenwert
    title: Natürliche Zahlen im Stellenwertsystem
    blocks:
      - type: text
        text: >-
          Wenn du später 12 % als 0,12 schreiben willst, musst du wissen, was jede Stelle einer Zahl wert ist. Das ist der
          **Stellenwert**: Ganz rechts stehen die Einer, dann Zehner, Hunderter, Tausender. Jede Stelle ist zehnmal so viel
          wert wie die rechts neben ihr.
      - type: example
        title: Die Zahl 3456
        blocks:
          - type: text
            text: "In 3456 steht die 4 an der Hunderterstelle. Sie bedeutet 4 · 100 = 400. Die Zahl ist die Summe 3 · 1000 + 4 · 100 + 5 · 10 + 6 · 1."
      - type: single-choice
        id: recap-hunderter
        text: "Wie viele Hunderter hat die Zahl 40 782 insgesamt?"
        options:
          - text: "7"
            correct: false
            info: Das ist nur die Ziffer an der Hunderterstelle. Gefragt ist, wie viele Hunderter die ganze Zahl enthält.
          - text: "40"
            correct: false
            info: 40 sind die Zehntausender. Du hast die Hunderter noch nicht gezählt.
          - text: "407"
            correct: true
            info: "40 782 = 407 · 100 + 82. Die Ziffern 4, 0, 7 vor den letzten zwei Stellen sagen, wie viele Hunderter es sind."
          - text: "4078"
            correct: false
            info: "4078 wären die Zehner: 40 782 = 4078 · 10 + 2."
        explanation: "40 782 = 407 · 100 + 82, also hat die Zahl 407 Hunderter."
      - type: text
        text: >-
          Wenn du dich vertan hast, übe den Baustein „Natürliche Zahlen im Stellenwertsystem“
          ([Kartenseite](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/)).
  - type: section
    id: bruchbegriff
    title: Bruchbegriff
    blocks:
      - type: text
        text: >-
          Wenn du verstehen willst, was 12 % bedeuten, brauchst du Brüche: 12 % sind 12 von 100 gleichen Teilen. Ein **Bruch**
          beschreibt einen Teil eines Ganzen. Der **Nenner** unten sagt, in wie viele gleiche Teile das Ganze geteilt ist.
          Der **Zähler** oben sagt, wie viele dieser Teile gemeint sind. **Kürzen** heißt, Zähler und Nenner durch dieselbe
          Zahl zu teilen: $\frac{6}{8} = \frac{3}{4}$.
      - type: example
        title: Drei Achtel einer Pizza
        blocks:
          - type: text
            text: "Eine Pizza ist in 8 gleiche Stücke geschnitten. Du isst 3 Stücke. Das sind $\\frac{3}{8}$ der Pizza: Nenner 8, Zähler 3."
  - type: section
    id: dezimalbrueche
    title: Dezimalbrüche und Periode
    blocks:
      - type: text
        text: >-
          Wenn du mit Prozentsätzen rechnest, brauchst du Dezimalzahlen. Dafür wandelst du einen Bruch um: Du teilst Zähler
          durch Nenner. Hinter dem Komma stehen Zehntel, Hundertstel, Tausendstel. Manche Dezimalzahlen brechen ab, andere
          wiederholen sich (**Periode**).
      - type: example
        title: Drei Viertel und ein Drittel
        blocks:
          - type: text
            text: "$\\frac{3}{4} = 3 : 4 = 0{,}75$. Die Rechnung bricht ab. $\\frac{1}{3} = 1 : 3$ ergibt 0,333… Die 3 wiederholt sich immer weiter: Das ist die **Periode**. Ein **Hundertstel** ist $\\frac{1}{100}$ = 0,01. Prozent heißt Hundertstel: 12 % sind $\\frac{12}{100}$ = 0,12."
      - type: single-choice
        id: recap-anteil
        text: "Eine Schachtel hat 12 gleiche Pralinen. Du isst 9. Welche Dezimalzahl beschreibt den Anteil, den du gegessen hast?"
        options:
          - text: "0,75"
            correct: true
            info: "Du hast 9 von 12 gegessen, das sind $\\frac{9}{12} = \\frac{3}{4}$ der Schachtel. 3 : 4 = 0,75."
          - text: "0,9"
            correct: false
            info: Das wäre 9 Zehntel. Der Nenner ist aber 12, denn die Schachtel hat 12 gleiche Teile.
          - text: "0,09"
            correct: false
            info: Du hast nur die 9 hinter das Komma geschrieben. Teile 9 durch 12.
          - text: "1,33"
            correct: false
            info: "Das ist 12 : 9. Der Zähler (9) wird durch den Nenner (12) geteilt, nicht umgekehrt."
        explanation: "$\\frac{9}{12} = \\frac{3}{4}$ und 3 : 4 = 0,75."
      - type: text
        text: >-
          Wenn du dich vertan hast, übe die Bausteine „Bruchbegriff“
          ([Kartenseite](https://lernapps.net/apps/map/mathematik/c/brueche-begriff/)) und „Dezimalbrüche und Periode“
          ([Kartenseite](https://lernapps.net/apps/map/mathematik/c/dezimalbrueche/)).
  - type: section
    id: checkliste
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |-
          - natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen kannst.
          - Brüche als Teil eines Ganzen deuten und darstellen kannst.
          - Brüche in Dezimalbrüche umwandeln und erklären kannst, ob sie abbrechen oder sich wiederholen.

# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: >-
  Wiederholung für das Kapitel Prozentrechnung: Stellenwert, Bruch, Dezimalzahl. Je Baustein Begriffe, ein Beispiel und
  ein Kurztest.
recap: [mathematik/natuerliche-zahlen, mathematik/brueche-begriff, mathematik/dezimalbrueche]
blocks:
  - type: text
    text: >-
      Das brauchst du für dieses Kapitel: Zahlen nach Stellen lesen, Brüche deuten und Brüche als Dezimalzahlen
      schreiben. Lies jeden Abschnitt und mach den Kurztest. Er zählt nichts und wird nicht gespeichert.
  - type: section
    id: stellenwert
    title: Natürliche Zahlen im Stellenwertsystem
    blocks:
      - type: text
        text: >-
          Der **Stellenwert** einer Ziffer hängt von ihrer Stelle ab: ganz rechts stehen die Einer, dann Zehner, Hunderter,
          Tausender. Jede Stelle ist zehnmal so viel wert wie die rechts neben ihr.
      - type: example
        title: Die Zahl 3456
        blocks:
          - type: text
            text: "In 3456 steht die 4 an der Hunderterstelle. Sie bedeutet 4 · 100 = 400. Die Zahl ist die Summe 3 · 1000 + 4 · 100 + 5 · 10 + 6 · 1."
      - type: vue-component
        id: test-stellenwert
        component: Kurztest
        props:
          question: "Wie viele Hunderter hat die Zahl 40 782 insgesamt?"
          options:
            - {
                text: "7",
                correct: false,
                info: "Das ist nur die Ziffer an der Hunderterstelle. Gefragt ist, wie viele Hunderter die ganze Zahl enthält.",
              }
            - {
                text: "40",
                correct: false,
                info: "40 sind die Tausender der Zahl 40 782 geteilt durch 1000 gerundet. Du hast die Hunderter noch nicht gezählt.",
              }
            - {
                text: "407",
                correct: true,
                info: "40 782 = 407 · 100 + 82. Die Ziffern 4, 0, 7 vor den letzten zwei Stellen sagen, wie viele Hunderter es sind.",
              }
            - { text: "4078", correct: false, info: "4078 wären die Zehner: 40 782 = 4078 · 10 + 2." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Wie viele Hunderter hat die Zahl 40 782 insgesamt? Antworten: 7, 40, 407 oder 4078. Richtig ist 407,
          denn 40 782 = 407 · 100 + 82.
      - type: text
        text: >-
          Wenn du dich vertan hast: Übe den Baustein „Natürliche Zahlen im Stellenwertsystem“, siehe seine
          [Kartenseite](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/).
  - type: section
    id: bruchbegriff
    title: Bruchbegriff
    blocks:
      - type: text
        text: >-
          Ein **Bruch** beschreibt einen Teil eines Ganzen. Der **Nenner** unten sagt, in wie viele gleiche Teile das Ganze
          geteilt ist. Der **Zähler** oben sagt, wie viele dieser Teile gemeint sind. **Kürzen** heißt, Zähler und Nenner durch dieselbe Zahl zu teilen: $\frac{6}{8} = \frac{3}{4}$.
      - type: example
        title: Drei Achtel einer Pizza
        blocks:
          - type: text
            text: "Eine Pizza ist in 8 gleiche Stücke geschnitten. Du isst 3 Stücke. Das sind $\\frac{3}{8}$ der Pizza: Nenner 8, Zähler 3."
      - type: vue-component
        id: test-bruchbegriff
        component: Kurztest
        props:
          question: "Eine Schachtel hat 12 gleiche Pralinen. Du isst 9. Welchen Bruch der Schachtel hast du gegessen, gekürzt?"
          options:
            - {
                text: "Drei Viertel",
                correct: true,
                info: "Neun Zwölftel, beide Zahlen durch 3 geteilt: drei Viertel. Probe: 3 von 4 gleichen Teilen sind 9 von 12.",
              }
            - {
                text: "Neun Zwölftel",
                correct: false,
                info: "Das ist der Bruch vor dem Kürzen. Gefragt ist die gekürzte Form: Zähler und Nenner lassen sich durch 3 teilen.",
              }
            - {
                text: "Drei Zwölftel",
                correct: false,
                info: "Du hast nur den Zähler gekürzt. Beim Kürzen teilst du Zähler und Nenner durch dieselbe Zahl.",
              }
            - {
                text: "Vier Drittel",
                correct: false,
                info: "Das ist größer als ein Ganzes. Du hast gegessen, was weniger als die ganze Schachtel ist.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Eine Schachtel hat 12 gleiche Pralinen, du isst 9. Welchen Bruch hast du gegessen, gekürzt? Richtig ist drei Viertel: neun Zwölftel, durch 3 gekürzt.
      - type: text
        text: >-
          Wenn du dich vertan hast: Übe den Baustein „Bruchbegriff“, siehe seine
          [Kartenseite](https://lernapps.net/apps/map/mathematik/c/brueche-begriff/).
  - type: section
    id: dezimalbrueche
    title: Dezimalbrüche und Periode
    blocks:
      - type: text
        text: >-
          Einen Bruch wandelst du in eine **Dezimalzahl** um, indem du Zähler durch Nenner teilst. Hinter dem Komma stehen
          Zehntel, Hundertstel, Tausendstel. Manche Dezimalzahlen brechen ab, andere wiederholen sich (**Periode**).
      - type: example
        title: Drei Viertel und ein Drittel
        blocks:
          - type: text
            text: "$\\frac{3}{4} = 3 : 4 = 0{,}75$. Die Rechnung bricht ab. $\\frac{1}{3} = 1 : 3$ ergibt 0,333… Die 3 wiederholt sich immer weiter: Das ist die **Periode**. Ein **Hundertstel** ist $\\frac{1}{100}$ = 0,01. Prozent heißt Hundertstel: 12 % sind $\\frac{12}{100}$ = 0,12."
      - type: vue-component
        id: test-dezimalbrueche
        component: Kurztest
        props:
          question: "Welche Dezimalzahl ist sieben Achtel?"
          options:
            - { text: "0,78", correct: false, info: "Das ist nur die 7 und die 8 hinter dem Komma. Teile 7 durch 8." }
            - {
                text: "0,875",
                correct: true,
                info: "7 : 8 = 0,875. Probe: ein Achtel ist 0,125, sieben Achtel sind 7 · 0,125 = 0,875.",
              }
            - { text: "0,125", correct: false, info: "0,125 ist ein Achtel. Sieben Achtel sind das Siebenfache." }
            - { text: "8,7", correct: false, info: "8,7 ist größer als 1. Sieben Achtel sind weniger als ein Ganzes." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welche Dezimalzahl ist sieben Achtel? Antworten: 0,78, 0,875, 0,125 oder 8,7. Richtig ist 0,875, denn
          7 : 8 = 0,875.
      - type: text
        text: >-
          Wenn du dich vertan hast: Übe den Baustein „Dezimalbrüche und Periode“, siehe seine
          [Kartenseite](https://lernapps.net/apps/map/mathematik/c/dezimalbrueche/).
  - type: section
    id: checkliste
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |-
          - natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen kannst.
          - Brüche als Teil eines Ganzen deuten und darstellen kannst.
          - Brüche in Dezimalbrüche umwandeln und erklären kannst, ob sie abbrechen oder sich wiederholen.

# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
# The strand of the learning map the app stays in; each page names its competencies (ids of map/mathematik.yaml in
# lernapps/apps).
strand: mathematik/arithmetik
title: "Mathe: Arithmetik – Prozentrechnung"
intro: |
  Hier lernst du Prozentrechnung und einfache Zinsrechnung für die Klassen 7 und 8. Der Prozentstreifen zeigt dir bei
  jeder Aufgabe, welche Stelle fehlt. Jede Seite erklärt eine Sache mit Regel und Beispiel. Danach übst du mit
  Aufgaben. Jede Aufgabe sagt dir sofort, ob dein Ergebnis stimmt.
languages: [de]
chapters: [prozent]
sources:
  - title: Kerncurriculum Mathematik Sekundarstufe I, Hessisches Kultusministerium
    url: https://kultus.hessen.de/unterricht/kerncurricula-und-lehrplaene
  - title: Bildungsstandards im Fach Mathematik, Kultusministerkonferenz (2022)
    url: https://www.kmk.org/bildungsministerkonferenz/bildungsthemen/bildungsstandards.html
  - title: Lernlandkarte Mathematik, lernapps.net
    url: https://lernapps.net/apps/map/mathematik/
tutor:
  rules: |
    - Gerechnet wird auf Papier und in der App, nicht im Chat. Das Ergebnis tippt das Kind in die App; im Chat
      stellst du Überschlags- und Warum-Fragen.
    - Erklär am Prozentstreifen der Seite, nicht abstrakt: Frag zuerst „Was siehst du? Welche Stelle fehlt?“.
    - Macht das Kind einen typischen Fehler, benenne die Idee hinter dem Fehler, nicht nur „falsch“. Zum Beispiel:
      „Du hast den Unterschied durch den falschen Wert geteilt. Welcher Wert ist hier 100 %?“
    - Eine Seite ist erst geschafft, wenn drei Aufgaben richtig waren und das Kind eine davon erklären kann. Dann
      bittest du um eine Aufgabe ganz von Hand, als Foto nur vom Blatt, ohne Namen. Prüf jeden Schritt; ist einer
      falsch, nenn den ersten und stell eine Leitfrage dazu, statt ihn zu verbessern.
    - Brüche wie 3/8 sind in der Eingabe erlaubt.
    - Fehlt dem Kind die Erklärung, geh noch einmal Schritt für Schritt durch Regel und Beispiel der Seite, bevor du
      neue Aufgaben stellst.
